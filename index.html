<body>

<style>
/* Layout: fixed header with tab bar, single scrolling column, session cards keyed by colour to session type */
:root{
  --bg:#f5f4f1; --surface:#ffffff; --line:#ded9d2; --fg:#1b1a18; --muted:#6c675f;
  --speed:#c9442a; --aero:#1f6f8b; --gym:#7a5c2e; --easy:#5f6b57; --off:#9a958c;
  --tint-speed:#fbeae5; --tint-aero:#e6f0f4; --tint-easy:#eef0ea; --tint-off:#efedea;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517; --surface:#1c1e21; --line:#2e3135; --fg:#eceae6; --muted:#9a968e;
  --speed:#ff7a55; --aero:#5cc3e8; --gym:#d8ac62; --easy:#a8bfa0; --off:#787571;
  --tint-speed:#2a1c18; --tint-aero:#14262e; --tint-easy:#1c221b; --tint-off:#202224; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1c1e21; --line:#2e3135; --fg:#eceae6; --muted:#9a968e;
  --speed:#ff7a55; --aero:#5cc3e8; --gym:#d8ac62; --easy:#a8bfa0; --off:#787571;
  --tint-speed:#2a1c18; --tint-aero:#14262e; --tint-easy:#1c221b; --tint-off:#202224; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
@media(max-width:640px){
  main.wrap{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  header.top nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow:visible}
  header.top nav button{flex:1 1 0;padding:8px 2px;font-size:11px;border-bottom:0;border-radius:8px;text-align:center}
  header.top nav button[aria-selected="true"]{color:var(--speed);background:var(--tint-speed)}
  .brand{padding:10px 0 8px}
}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px}
.brand h1{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:0 0 auto;appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--speed)}
nav button:focus-visible,.nav-week:focus-visible{outline:2px solid var(--aero);outline-offset:2px}
h2{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.today{border-left:4px solid var(--speed)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:2px 0 10px}
.dayhead h3{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}
.pill{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.p-SPEED{color:var(--speed)} .p-KEY{color:var(--aero)} .p-LONG{color:var(--aero)}
.p-EASY{color:var(--easy)} .p-OFF{color:var(--off)} .p-TEST{color:var(--gym)}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.times span{font-family:var(--mono);font-size:12px;background:var(--tint-off);border-radius:5px;padding:3px 7px;color:var(--fg)}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row dt{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
.row dd{margin:0;min-width:0}
dl{margin:0}
@media(max-width:520px){.row{grid-template-columns:1fr;gap:2px}}
.weeknav{display:flex;align-items:center;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.nav-week{font-family:var(--mono);font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:6px 11px;cursor:pointer}
.nav-week[disabled]{opacity:.4;cursor:default}
.wlabel{font-family:var(--display);font-size:16px;font-weight:600}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gym);border:1px solid var(--gym);border-radius:999px;padding:2px 7px}
.mini{display:grid;gap:8px}
.mini .card{margin:0;padding:12px 14px}
.mini h4{font-family:var(--display);font-size:15px;margin:0 0 4px}
.mini p{margin:0 0 4px;font-size:14px}
.mini .sub{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono)}
.inputs{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:12px}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input{font-family:var(--mono);font-size:15px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:118px}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
ol.rules{margin:0;padding-left:20px} ol.rules li{margin-bottom:5px}
.ph{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.ph dt{font-family:var(--mono);font-size:12px;color:var(--speed);white-space:nowrap}
.ph dd{margin:0 0 8px;font-size:14px}
.ph dd b{font-family:var(--display);display:block;font-size:15px}
</style>

const START = new Date("2026-09-28T00:00:00");
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = iso => { const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}); };

function todayIndex(){
  const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.floor((t - START) / 86400000);
  if (diff < 0) return {w:1, d:0, state:"before"};
  if (diff > 160) return {w:23, d:6, state:"after"};
  return {w: Math.floor(diff/7)+1, d: diff%7, state:"in"};
}
function dayCard(day, week, isToday){
  const times = day.t.map(x => `<span>${esc(x)}</span>`).join("");
  const rows = [["Running", day.r], ["Gym", day.g], ["Isometrics", day.i], ["Study", day.s]]
    .filter(([,v]) => v && v !== "-")
    .map(([k,v]) => `<div class="row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  return `<article class="card${isToday ? " today" : ""}">
    <div class="eyebrow">Week ${week.w} · ${esc(week.p)}${week.tag ? " · " + esc(week.tag) : ""}</div>
    <div class="dayhead"><h3>${fmt(day.iso)}</h3><span class="pill p-${day.f}">${day.f}</span></div>
    <div class="times">${times}</div><dl>${rows}</dl></article>`;
}
function renderToday(){
  const {w, d, state} = todayIndex();
  const week = DATA.weeks[w-1], day = week.days[d];
  const next = d < 6 ? week.days[d+1] : (DATA.weeks[w] ? DATA.weeks[w].days[0] : null);
  const lead = state === "before" ? "<p class='note'>The block starts on 21 September. This is day one.</p>"
    : state === "after" ? "<p class='note'>The block is finished. This is the last day of it.</p>" : "";
  document.getElementById("v-today").innerHTML =
    `<h2>Today</h2>${lead}${dayCard(day, week, state === "in")}
     ${next ? `<h2>Tomorrow</h2>${dayCard(next, d < 6 ? week : DATA.weeks[w], false)}` : ""}`;
}
let weekCursor = todayIndex().w;
function renderWeek(){

}

  return ZONES.map(([n, m, use]) => { const s = km * m;
    return `<tr><td>${n}</td><td class="num">${mmss(s)}</td><td class="num">${Math.round(s*0.4)}s</td>
      <td class="num">${Math.round(s*0.8)}s</td><td class="num">${Math.round(s)}s</td><td>${use}</td></tr>`; }).join("");
}
function renderPaces(){
  const km = +store.get("km", 205), hr = +store.get("hr", 195);
  document.getElementById("v-paces").innerHTML = `<h2>Paces from your 1 km</h2>
    <div class="inputs">
      <div><label for="in-km">1 km time (seconds)</label><input id="in-km" type="number" value="${km}" min="120" max="400"></div>
      <div><label for="in-hr">Max heart rate</label><input id="in-hr" type="number" value="${hr}" min="150" max="230"></div>
      <div><label>Zone 2 ceiling</label><input id="out-hr" value="${Math.round(hr*0.72)} bpm" readonly></div>
    </div>
    <div class="scroll"><table><thead><tr><th>Zone</th><th>per km</th><th>400 m</th><th>800 m</th><th>1000 m</th><th>Used in</th></tr></thead>
    <tbody id="pacebody">${paceRows(km)}</tbody></table></div>
    <p class="note">Easy running is held by heart rate, below about 72% of your max, at a pace that lets you speak in full sentences.
    The easy figure above is what to expect, not a target. Hard sessions are held on pace.</p>
    <h2>Phases</h2><div class="card"><dl class="ph">${DATA.phases.map(p =>
      `<dt>W${p.w}</dt><dd><b>${esc(p.n)}</b>${esc(p.d)}</dd>`).join("")}</dl></div>`;
  const kmEl = document.getElementById("in-km"), hrEl = document.getElementById("in-hr");
  kmEl.oninput = () => { const v = +kmEl.value; if (v > 120 && v < 400) {
    document.getElementById("pacebody").innerHTML = paceRows(v); store.set("km", v); } };
  hrEl.oninput = () => { const v = +hrEl.value; if (v > 150 && v < 230) {
    document.getElementById("out-hr").value = Math.round(v*0.72) + " bpm"; store.set("hr", v); } };
}
function renderPlan(){
  document.getElementById("v-plan").innerHTML = `<h2>What this block is</h2>
    <div class="card"><p><b>Priority order.</b> GAA Tuesday and Friday are fixed. Then the Tuesday speed session that runs before it, then Wednesday's key aerobic session, then Wednesday's lower gym, then Monday's long run. Isometrics and upper gym last. When a week goes wrong, cut from the bottom.</p>
    <ol class="rules">
      <li>Nothing hard the day before GAA. Monday and Thursday are easy running, upper body and holds only.</li>
      <li>Stop a sprint session at the first rep more than 3% off the session best.</li>
      <li>Easy days below 72% of max heart rate. Zone 3 easy days give the fatigue of hard training and the adaptation of easy training.</li>
      <li>Jumps come before lifts: CMJ on Wednesday, broad jump on Saturday. Both are January test items.</li>
      <li>Tendon holds Monday, Thursday and Saturday: 5 x 4 x 3 s at 85-95% of measured peak force. Collagen 45 min before.</li>
      <li>If Wednesday's paces slip two weeks running, shorten Monday's long run and keep Wednesday intact.</li>
      <li>Tendon pain above 3/10: that tendon switches to 5 × 45 s at about 70% effort. Keep loading, don't stop.</li>
    </ol></div>
    <h2>Keeping it on your phone</h2>
    <div class="card"><p>Open this page in Safari, tap the share button, then <b>Add to Home Screen</b>. It opens from the
    home screen like an app and remembers your 1 km time and max heart rate on that phone.</p>
    <p class="sub">For a custom name and icon, build it in Shortcuts instead: new shortcut, <b>Open URL</b> with this page's
    address, then share the shortcut to your home screen. It needs a connection and your Claude sign-in either way, so
    keep the Word plan on the phone as the offline copy.</p></div>
    <h2>Every week</h2><div class="mini">${DATA.weeks.map(w =>
      `<article class="card"><h4>Week ${w.w} · ${esc(w.p)}${w.tag ? " · " + esc(w.tag) : ""}</h4>
       <p class="sub">${fmt(w.from)} – ${fmt(w.to)}</p>
       <p><b>Tue</b> ${esc(w.days[1].r.split(".")[0])}</p>
       <p><b>Wed</b> ${esc(w.days[2].r.split(".")[0])}</p>
       <p><b>Sat</b> ${esc(w.days[5].g.split(".")[0])}</p></article>`).join("")}</div>`;
}
const TABS = [["today", renderToday], ["week", renderWeek], ["loads", renderLoads], ["paces", renderPaces], ["plan", renderPlan]];
function show(name){
  TABS.forEach(([n, fn]) => {
    const on = n === name;
    document.getElementById("t-" + n).setAttribute("aria-selected", on ? "true" : "false");
    document.getElementById("v-" + n).hidden = !on;
    if (on) fn();
  });
  store.set("tab", name);
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
}
TABS.forEach(([n]) => { document.getElementById("t-" + n).onclick = () => show(n); });
const initial = ["today","week","loads","paces","plan"].includes(location.hash.slice(1))
  ? location.hash.slice(1) : store.get("tab", "today");
show(initial);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
