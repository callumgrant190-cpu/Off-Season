<style>
/* Layout: fixed header with tab bar, single scrolling column, session cards keyed by colour to session type */
:root{
  --bg:#f5f4f1; --surface:#ffffff; --line:#ded9d2; --fg:#1b1a18; --muted:#6c675f;
  --speed:#c9442a; --aero:#1f6f8b; --gym:#7a5c2e; --easy:#5f6b57; --off:#9a958c;
  --tint-speed:#fbeae5; --tint-aero:#e6f0f4; --tint-easy:#eef0ea; --tint-off:#efedea; --uni:#6a4c93; --tint-uni:#f1ecf8; --tint-gym:#f3ece1; --c-proj:#2f5f9e; --t-proj:#e3ecf7; --c-next:#9a6f00; --t-next:#fbf1d6; --c-fsc:#b5582a; --t-fsc:#fbe6dc; --c-esi:#3d7a3a; --t-esi:#e4f0e2; --c-light:#7b7770; --t-light:#efedea; --c-work:#8a857c; --t-work:#ebe8e3; --c-exam:#1e7a74; --t-exam:#ddf0ee;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517; --surface:#1c1e21; --line:#2e3135; --fg:#eceae6; --muted:#9a968e;
  --speed:#ff7a55; --aero:#5cc3e8; --gym:#d8ac62; --easy:#a8bfa0; --off:#787571;
  --tint-speed:#2a1c18; --tint-aero:#14262e; --tint-easy:#1c221b; --tint-off:#202224; --uni:#c3a6f0; --tint-uni:#241d30; --tint-gym:#262117; --c-proj:#8fb4ea; --t-proj:#1a2433; --c-next:#e6c35c; --t-next:#2a2414; --c-fsc:#f0a07a; --t-fsc:#2c1c14; --c-esi:#9fd39a; --t-esi:#18261a; --c-light:#a9a59e; --t-light:#222427; --c-work:#8d8983; --t-work:#202224; --c-exam:#7fd1c8; --t-exam:#142624; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1c1e21; --line:#2e3135; --fg:#eceae6; --muted:#9a968e;
  --speed:#ff7a55; --aero:#5cc3e8; --gym:#d8ac62; --easy:#a8bfa0; --off:#787571;
  --tint-speed:#2a1c18; --tint-aero:#14262e; --tint-easy:#1c221b; --tint-off:#202224; --uni:#c3a6f0; --tint-uni:#241d30; --tint-gym:#262117; --c-proj:#8fb4ea; --t-proj:#1a2433; --c-next:#e6c35c; --t-next:#2a2414; --c-fsc:#f0a07a; --t-fsc:#2c1c14; --c-esi:#9fd39a; --t-esi:#18261a; --c-light:#a9a59e; --t-light:#222427; --c-work:#8d8983; --t-work:#202224; --c-exam:#7fd1c8; --t-exam:#142624; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
@media(max-width:640px){
  main.wrap{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  header.top nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow:visible}
  header.top nav button{flex:1 1 0;padding:8px 2px;font-size:11px;border-bottom:0;border-radius:8px;text-align:center}
  header.top nav button[aria-selected="true"]{color:var(--speed);background:var(--tint-speed)}
  .brand{padding:10px 0 8px}
}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px}
.brand h1{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:0 0 auto;appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--speed)}
nav button:focus-visible,.nav-week:focus-visible{outline:2px solid var(--aero);outline-offset:2px}
h2{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.today{border-left:4px solid var(--speed)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:2px 0 10px}
.dayhead h3{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}
.pill{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.p-SPEED{color:var(--speed)} .p-KEY{color:var(--aero)} .p-LONG{color:var(--aero)}
.p-EASY{color:var(--easy)} .p-OFF{color:var(--off)} .p-TEST{color:var(--gym)}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.times span{font-family:var(--mono);font-size:12px;background:var(--tint-off);border-radius:5px;padding:3px 7px;color:var(--fg)}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row dt{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
.row dd{margin:0;min-width:0}
dl{margin:0}
@media(max-width:520px){.row{grid-template-columns:1fr;gap:2px}}
.weeknav{display:flex;align-items:center;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.nav-week{font-family:var(--mono);font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:6px 11px;cursor:pointer}
.nav-week[disabled]{opacity:.4;cursor:default}
.wlabel{font-family:var(--display);font-size:16px;font-weight:600}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gym);border:1px solid var(--gym);border-radius:999px;padding:2px 7px}
.mini{display:grid;gap:8px}
.mini .card{margin:0;padding:12px 14px}
.mini h4{font-family:var(--display);font-size:15px;margin:0 0 4px}
.mini p{margin:0 0 4px;font-size:14px}
.mini .sub{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono)}
.inputs{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:12px}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input{font-family:var(--mono);font-size:15px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:118px}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
ol.rules{margin:0;padding-left:20px} ol.rules li{margin-bottom:5px}
.ph{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.ph dt{font-family:var(--mono);font-size:12px;color:var(--speed);white-space:nowrap}
.ph dd{margin:0 0 8px;font-size:14px}
.ph dd b{font-family:var(--display);display:block;font-size:15px}
/* Uni timetable layer: purple marks anything from the academic timetable */
.times span.u{background:var(--tint-uni);color:var(--uni)}
.times span.due{background:var(--uni);color:var(--surface);font-weight:600}
.p-DUE{color:var(--uni)}
.unirow dt{color:var(--uni)}
.ui{margin:0 0 4px;font-size:14px}
.ui .ut{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.ui b{color:var(--uni);font-weight:600}
.u-due,.u-assess{font-weight:600}
.unote{margin:4px 0 6px;font-size:13px;color:var(--muted);border-left:2px solid var(--uni);padding-left:8px}
.unicard{border-left:4px solid var(--uni)}
.unicard p{margin:6px 0 8px;font-size:14px}
.duecard{padding:6px 14px}
.drow{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:8px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .dd{grid-column:1;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.drow .dx{grid-column:1;font-size:14px;min-width:0}
.drow .dx b{color:var(--uni);font-weight:600}
.drow .dn{grid-column:2;grid-row:1/span 2;align-self:center;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.drow.soon .dn{color:var(--uni);font-weight:600}
.mini .uni{color:var(--uni);font-size:13px}
.times span.st{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.sb{margin:0 0 3px;font-size:14px}
.sb b{font-weight:600}
.sb .ut{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.sf{margin:6px 0 0;font-size:13px;color:var(--muted)}
.sf b{color:var(--fg);font-weight:600}
/* Day view: calendar-style hourly timeline */
.dv-nav{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.dv-date{flex:1;min-width:0;display:flex;flex-direction:column}
.dv-date b{font-family:var(--display);font-size:18px;line-height:1.2}
.dv-allday{display:grid;gap:4px;margin:0 0 8px}
.dv-ad{font-size:13px;padding:5px 9px;border-radius:7px;background:var(--tint-off);color:var(--fg)}
.dv-ad.ad-due{background:var(--uni);color:var(--surface);font-weight:600}
.dv-ad.ad-target{background:var(--tint-uni);color:var(--uni)}
.dv-ad.ad-note{background:transparent;border-left:2px solid var(--uni);color:var(--muted);border-radius:0;padding:2px 9px}
.dv-grid{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:pan-y}
.dv-h{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.dv-h span{position:absolute;left:6px;top:2px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.dv-ev{position:absolute;box-sizing:border-box;overflow:hidden;text-align:left;border:0;border-left:3px solid var(--c);background:var(--t);color:var(--fg);
  border-radius:6px;padding:3px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;line-height:1.25;z-index:2}
.dv-ev b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-ev .ev-t{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.dv-ev .ev-d{font-size:11.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;margin-top:1px}
.dv-ev.short{flex-direction:row;align-items:center;gap:6px;padding:1px 6px}
.dv-ev:focus-visible{outline:2px solid var(--aero);outline-offset:1px}
.dv-mark{position:absolute;left:46px;right:0;border-top:2px solid var(--uni);z-index:3;pointer-events:none}
.dv-mark span{position:absolute;right:4px;top:-10px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--uni);color:var(--surface);font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px}
.dv-now{position:absolute;left:42px;right:0;border-top:2px solid var(--speed);z-index:4;pointer-events:none}
.dv-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--speed)}
.dv-key{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0 0;font-size:12px;color:var(--muted)}
.dv-key i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--t);border-left:3px solid var(--c);margin-right:5px;vertical-align:-1px}
.k-speed,.k-gaa{--c:var(--speed);--t:var(--tint-speed)}
.k-aero{--c:var(--aero);--t:var(--tint-aero)}
.k-gym{--c:var(--gym);--t:var(--tint-gym)}
.k-easy,.k-vol{--c:var(--easy);--t:var(--tint-easy)}
.k-uni,.k-assess{--c:var(--uni);--t:var(--tint-uni)}
.k-assess b{color:var(--uni)}
.k-st-Project{--c:var(--c-proj);--t:var(--t-proj)}
.k-st-Next{--c:var(--c-next);--t:var(--t-next)}
.k-st-FSC{--c:var(--c-fsc);--t:var(--t-fsc)}
.k-st-ESI{--c:var(--c-esi);--t:var(--t-esi)}
.k-st-Light,.k-st-Review{--c:var(--c-light);--t:var(--t-light)}
.k-work{--c:var(--c-work);--t:var(--t-work)}
.k-st-Exam{--c:var(--c-exam);--t:var(--t-exam)}
.dv-open{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;cursor:pointer;margin-left:auto}
#dv-sheet{position:fixed;inset:0;z-index:60}
.sh-back{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sh-card{position:absolute;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:var(--surface);color:var(--fg);border-top:4px solid var(--c);
  border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:641px){.sh-card{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:24px;border-radius:14px}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h3{font-family:var(--display);font-size:19px;margin:2px 0 8px}
.sh-card p{margin:0;font-size:15px;line-height:1.55}
.sh-card .ev-t{font-family:var(--mono);font-size:12px;color:var(--muted)}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Off-Season Block</h1><span id="range">28 Sep 2026 – 7 Mar 2027</span></div>
  <nav role="tablist">
    <button role="tab" id="t-today" aria-selected="true">Today</button>
    <button role="tab" id="t-day" aria-selected="false">Day</button>
    <button role="tab" id="t-week" aria-selected="false">Week</button>
    <button role="tab" id="t-loads" aria-selected="false">Loads</button>
    <button role="tab" id="t-paces" aria-selected="false">Paces</button>
    <button role="tab" id="t-plan" aria-selected="false">Plan</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-today"></section>
  <section id="v-day" hidden></section>
  <section id="v-week" hidden></section>
  <section id="v-loads" hidden></section>
  <section id="v-paces" hidden></section>
  <section id="v-plan" hidden></section>
</main>

  list.forEach(e => { if (cluster.length && e.a >= end) { flush(); end = -1; } cluster.push(e); end = Math.max(end, e.b); });
  if (cluster.length) flush();

}
let dayCursor = null;
const LAST_DAY = () => DATA.weeks.length * 7 - 1;
function shiftDay(c, n){ const i = Math.max(0, Math.min(LAST_DAY(), (c.w - 1) * 7 + c.d + n)); return {w: Math.floor(i / 7) + 1, d: i % 7}; }
function openSheet(e){
  let s = document.getElementById("dv-sheet");
  if (!s) { s = document.createElement("div"); s.id = "dv-sheet"; document.body.appendChild(s); }
  s.innerHTML = `<div class="sh-back"></div><div class="sh-card k-${e.k}" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sh-head"><div><span class="ev-t">${e.s}–${e.e}</span><h3 id="sh-title">${esc(e.title)}</h3></div>
    <button class="nav-week" id="sh-x" aria-label="Close">✕</button></div>${e.detail ? `<p>${esc(e.detail)}</p>` : ""}</div>`;
  s.hidden = false;
  const close = () => { s.hidden = true; s.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  s.querySelector(".sh-back").onclick = close; s.querySelector("#sh-x").onclick = close;
  s.querySelector("#sh-x").focus();
}
function renderDay(scrollNow){
  if (!dayCursor) { const t = todayIndex(); dayCursor = {w: t.w, d: t.d}; }
  const week = DATA.weeks[dayCursor.w - 1], day = week.days[dayCursor.d];
  const {ev, marks, allday} = dayEvents(day, week);
  const pts = ev.flatMap(e => [e.a, e.b]).concat(marks.map(m => m.a));

  const endH = Math.max(23, Math.ceil(Math.max(...pts, 23 * 60) / 60));
  const y = n => (n - startH * 60) / 60 * HOUR_PX;

  let hours = "";
  for (let hr = startH; hr < endH; hr++) hours += `<div class="dv-h" style="top:${y(hr * 60)}px"><span>${String(hr).padStart(2, "0")}:00</span></div>`;
  const blocks = placed.map((e, i) => { const ht = Math.max(20, y(e.b) - y(e.a) - 2);
    return `<button class="dv-ev k-${e.k}${ht < 34 ? " short" : ""}" data-i="${i}" style="top:${y(e.a) + 1}px;height:${ht}px;` +
      `left:calc(${GUTTER}px + (100% - ${GUTTER + 4}px) * ${e.col} / ${e.ncol});width:calc((100% - ${GUTTER + 4}px) / ${e.ncol} - 3px)">` +
      `<span class="ev-t">${e.s}–${e.e}</span><b>${esc(e.title)}</b>${ht >= 60 && e.detail ? `<span class="ev-d">${esc(e.detail)}</span>` : ""}</button>`; }).join("");
  const markers = marks.map(m => `<div class="dv-mark" style="top:${y(m.a)}px"><span>${m.s} ${esc(m.title)}</span></div>`).join("");

  const i0 = (dayCursor.w - 1) * 7 + dayCursor.d;
  const key = [["speed", "Speed / GAA"], ["aero", "Running"], ["gym", "Gym"], ["easy", "Holds"], ["uni", "Class / meeting"],
    ["st-Project", "Project"], ["st-Next", "Next deadline"], ["st-FSC", "FSC"], ["st-ESI", "ESI"], ["st-Exam", "BIO3301 exam"], ["st-Light", "Light study"], ["work", "Work"]]
    .map(([k, l]) => `<span class="k-${k}"><i></i>${l}</span>`).join("");

    <div class="dv-nav">
      <button class="nav-week" id="dprev" aria-label="Previous day" ${i0 === 0 ? "disabled" : ""}>&larr;</button>
      <div class="dv-date"><b>${fmt(day.iso)}</b><span class="eyebrow">Week ${week.w} · ${esc(week.p)}${week.tag ? " · " + esc(week.tag) : ""}</span></div>
      <button class="nav-week" id="dnext" aria-label="Next day" ${i0 === LAST_DAY() ? "disabled" : ""}>&rarr;</button>
      <button class="nav-week" id="dtoday" ${isToday ? "disabled" : ""}>Today</button>
    </div>
    ${allday.length ? `<div class="dv-allday">${allday.map(a => `<div class="dv-ad ad-${a.k}">${esc(a.x)}</div>`).join("")}</div>` : ""}
    <div class="dv-grid" style="height:${y(endH * 60)}px">${hours}${blocks}${markers}${now}</div>
    <div class="dv-key">${key}</div>
    <p class="note">Tap a block for the full session. Swipe the timeline left or right to change day.</p>`;
  const go = c => { dayCursor = c; renderDay(false); };
  document.getElementById("dprev").onclick = () => go(shiftDay(dayCursor, -1));
  document.getElementById("dnext").onclick = () => go(shiftDay(dayCursor, 1));
  document.getElementById("dtoday").onclick = () => { const tt = todayIndex(); dayCursor = {w: tt.w, d: tt.d}; renderDay(true); };
  document.querySelectorAll("#v-day .dv-ev").forEach(b => { b.onclick = () => openSheet(placed[+b.dataset.i]); });

  g.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
  g.addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(shiftDay(dayCursor, dx < 0 ? 1 : -1)); }, {passive: true});
  if (scrollNow && isToday) { const el = document.getElementById("dv-now"); if (el) el.scrollIntoView({block: "center"}); }
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".dv-open");

});
const TABS = [["today", renderToday], ["day", () => renderDay(true)], ["week", renderWeek], ["loads", renderLoads], ["paces", renderPaces], ["plan", renderPlan]];
function show(name){
  TABS.forEach(([n, fn]) => {
    const on = n === name;
    document.getElementById("t-" + n).setAttribute("aria-selected", on ? "true" : "false");
    document.getElementById("v-" + n).hidden = !on;
    if (on) fn();

  store.set("tab", name);
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
}
TABS.forEach(([n]) => { document.getElementById("t-" + n).onclick = () => show(n); });
const initial = ["today","day","week","loads","paces","plan"].includes(location.hash.slice(1))
  ? location.hash.slice(1) : store.get("tab", "today");
show(initial);
